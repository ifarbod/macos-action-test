name: CI

on:
  push:
    branches:
      - master
    paths-ignore:
      - "**.md"

jobs:
  package-sdks:
    runs-on: xcode-27
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos
            platform: MacOSX
            sdk: MacOSX.sdk
          - name: ios
            platform: iPhoneOS
            sdk: iPhoneOS.sdk
          - name: tvos
            platform: AppleTVOS
            sdk: AppleTVOS.sdk
          - name: visionos
            platform: XROS
            sdk: XROS.sdk

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify SDK path
        run: |
          SDK_PATH="$(xcode-select -p)/Platforms/${{ matrix.platform }}.platform/Developer/SDKs/${{ matrix.sdk }}"
          ls -la "$SDK_PATH"

      - name: Create ZIP package
        run: |
          SDK_PATH="$(xcode-select -p)/Platforms/${{ matrix.platform }}.platform/Developer/SDKs/${{ matrix.sdk }}"
          zip -r "${{ matrix.name }}_sdk.zip" "$SDK_PATH"

      - name: Upload SDK package as artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}-sdk-package
          path: ${{ matrix.name }}_sdk.zip
