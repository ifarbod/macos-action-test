name: CI

on:
  push:
    branches:
      - master
    paths-ignore:
      - "**.md"

jobs:
  macos-build:
    strategy:
      matrix:
        os: [macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Full history for versioning/git tools

      - name: Compile
        run: |
          ./freestanding
          clang++ -v -o HelloWorld b.mm -framework Cocoa

      - name: Upload HelloWorld Artifact
        uses: actions/upload-artifact@v7
        with:
          name: HelloWorld-${{ matrix.os }}
          path: HelloWorld
